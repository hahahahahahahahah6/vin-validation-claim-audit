[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented vehicle-number claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
vin-validation-claim-audit = "vin_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["vin_validation_claim_audit*"]
